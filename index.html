
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAHARAJ AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f6fc;
  color: #172b4d;
}

header {
  background: #0755c9;
  color: white;
  padding: 22px 16px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 27px;
  letter-spacing: 2px;
}

header p {
  margin: 7px 0 0;
  font-size: 13px;
}

.container {
  max-width: 700px;
  margin: 20px auto;
  padding: 15px;
}

.welcome {
  background: white;
  padding: 22px;
  border-radius: 14px;
  text-align: center;
  box-shadow: 0 3px 12px #00000010;
}

.welcome h2 {
  color: #0755c9;
}

#chat {
  margin-top: 18px;
  min-height: 250px;
  max-height: 400px;
  overflow-y: auto;
  padding: 12px;
  background: white;
  border-radius: 14px;
}

.message {
  padding: 12px;
  margin: 10px 0;
  border-radius: 12px;
  line-height: 1.5;
  white-space: pre-wrap;
}

.user {
  background: #dceaff;
  margin-left: 35px;
}

.ai {
  background: #edf1f7;
  margin-right: 35px;
}

.input-area {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border: 1px solid #ccd6e5;
  border-radius: 10px;
  font-size: 16px;
}

button {
  background: #0755c9;
  color: white;
  border: none;
  padding: 13px 18px;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
}

footer {
  text-align: center;
  padding: 20px;
  color: #64748b;
  font-size: 12px;
}
</style>
</head>

<body>

<header>
  <h1>MAHARAJ AI</h1>
  <p>YOUR INTELLIGENT DIGITAL ASSISTANT</p>
</header>

<div class="container">

  <div class="welcome">
    <h2>Welcome to MAHARAJ AI</h2>
    <p>Your ideas. Your questions. Your intelligent assistant.</p>
    <p>How can I help you today?</p>
  </div>

  <div id="chat">
    <div class="message ai">
      Hello! Welcome to MAHARAJ AI.
      I am ready to assist you.
      What would you like to know?
    </div>
  </div>

  <div class="input-area">
    <input
      type="text"
      id="question"
      placeholder="Ask MAHARAJ AI..."
    >
    <button id="sendBtn" onclick="sendMessage()">
      SEND
    </button>
  </div>

</div>

<footer>
  MAHARAJ AI © 2026 | Created by MAHARAJ KAN-GIWA
</footer>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("question");

function addMessage(text, type) {
  const message = document.createElement("div");
  message.className = "message " + type;
  message.textContent = text;
  chat.appendChild(message);
  chat.scrollTop = chat.scrollHeight;
}

function sendMessage() {
  const question = input.value.trim();

  if (!question) return;

  addMessage(question, "user");
  input.value = "";

  setTimeout(() => {
    addMessage(
      "Thank you for using MAHARAJ AI! The AI engine has not yet been connected. We are preparing the intelligent response system. Please stay tuned.",
      "ai"
    );
  }, 500);
}

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    sendMessage();
  }
});
</script>

</body>
</html>
